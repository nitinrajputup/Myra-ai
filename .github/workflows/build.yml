
name: MYRA AI APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project ZIP
        run: |
          mkdir extracted
          unzip -q MYRA_AI_Kotlin_Starter.zip -d extracted

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -printf '%h\n' | head -n 1)
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find extracted -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" MYRA-AI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-AI-APK
          path: MYRA-AI-debug.apk
          retention-days: 7
